syntax = "proto3";

package vpn.agent.provider.v1;

option go_package = "github.com/ks-tool/vpn-agent/v2/internal/provider/transport/providerv1";

service ProviderChannel {
  rpc Connect(stream ProviderMessage) returns (stream AgentMessage);
}

message ProviderMessage {
  oneof message {
    Register register = 1;
    Response response = 2;
    bytes event = 3;
  }
}

message Register {
  string protocol_version = 1;
  bytes definition = 2;
}

message Response {
  string id = 1;
  int32 status = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string error = 5;
}

message AgentMessage {
  string id = 1;
  string method = 2;
  string path = 3;
  map<string, string> headers = 4;
  bytes body = 5;
}
