name: release-agent

on:
  push:
    tags:
      - "v*"
      - "providers/*/v*"

permissions:
  contents: write
  packages: write

jobs:
  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release vpn-agent
        if: startsWith(github.ref_name, 'v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oci-packer
        run: |
          version=1.0.3
          archive="oci-packer_${version}_linux_amd64.tar.gz"
          base_url="https://github.com/arenadata/oci-packer/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/oci-packer"
          curl -fsSL "$base_url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base_url/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c checksums.txt --ignore-missing)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oci-packer" oci-packer
          echo "$RUNNER_TEMP/oci-packer" >> "$GITHUB_PATH"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the tagged component
        run: build/oci-release.sh "${{ github.ref_name }}"
        env:
          OCI_LOGIN: ${{ github.actor }}
          OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
